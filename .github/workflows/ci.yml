name: CI Cross-build

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: Cross-platform build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout коду
        uses: actions/checkout@v4

      - name: Встановити CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
        shell: bash

      - name: Встановити CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update || true
          brew install cmake || true
        shell: bash

      - name: Встановити CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install cmake --yes --no-progress
        shell: powershell

      - name: Конфігурація та білд (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ./ci.sh || true
          ./ci.sh
        shell: bash

      - name: Конфігурація та білд (Windows)
        if: matrix.os == 'windows-latest'
        run: .\ci.bat
        shell: powershell

      - name: Run Unit Tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          ctest --output-on-failure
        shell: cmd

      - name: Run Unit Tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          ctest --output-on-failure
        shell: bash

      - name: Upload Build Artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            build/hello*
            build/*.exe
            build/csad*
            build/unit_tests*
          if-no-files-found: ignore

      - name: Upload Build Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            build\*.exe
            build\*
          if-no-files-found: ignore
